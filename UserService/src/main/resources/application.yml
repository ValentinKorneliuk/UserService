server:
  port: 8081

spring:
  application:
    name: user-service
  config:
    import: optional:file:.env[.properties]
  profiles:
    active: local
  liquibase:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect