spring:
  application:
    name: user-service
  liquibase:
    enabled: true
  datasource:
    url: jdbc:postgresql://localhost:15432/user_service_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  data:
    redis:
      host: localhost
      port: 6379
      password: redispassword

server:
  port: 8081
