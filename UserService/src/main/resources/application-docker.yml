spring:
  datasource:
    url: jdbc:postgresql://user-service-db:5432/user_service_db
    username: ${USER_SERVICE_DATABASE_USER}
    password: ${USER_SERVICE_DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: redis
      port: 6379
      password: ${REDIS_PASSWORD}

auth:
  public-key-url: http://auth-service:8082/.well-known/jwks.json