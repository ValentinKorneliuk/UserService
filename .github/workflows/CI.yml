name: CI

on:
  push:
    branches:
      - '**'
    tags:
      - 'v.*.*'

jobs:
  build-test-and-docker:
    runs-on: ubuntu-latest

    env:
      PACKAGE_TOKEN: ${{ secrets.PACKAGE_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Maven packages
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Set up Maven settings
        run: |
          mkdir -p ~/.m2
          cp .github/maven-settings.xml ~/.m2/settings.xml

      - name: Build with Maven and run tests
        working-directory: UserService
        run: mvn clean install

      - name: Get Git Tag
        id: get_tag
        run: echo "TAG=$(git describe --tags --abbrev=0)" >> $GITHUB_ENV

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/user-service:${{ env.TAG }} ./UserService

      - name: Push Docker image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/user-service:${{ env.TAG }}