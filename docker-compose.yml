services:
  user_service_db:
    image: postgres:17
    container_name: user_service_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: user_service_db
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "15432:5432"
    volumes:
      - user_service_data:/var/lib/postgresql/data/pgdata
    networks:
      - user_service_network
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    command: >
      postgres -c max_connections=1000
               -c shared_buffers=256MB
               -c effective_cache_size=768MB
               -c maintenance_work_mem=64MB
               -c checkpoint_completion_target=0.7
               -c wal_buffers=16MB
               -c default_statistics_target=100
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d user_service_db" ]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    tty: true
    stdin_open: true
  
  redisserver:
    image: redis:8.0.2
    container_name: redis
    ports:
      - 6379:6379
    command: ["redis-server", "--requirepass", "redispassword", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
    networks:
      - user_service_network



volumes:
  user_service_data:
    driver: local

networks:
  user_service_network:
    driver: bridge